     ch:[ { l:"Total war — everything in", fx:{G:[-13,-8],A:[9,13]}, o:"The realm becomes a camp. Every road carries spears; every hearth gives a son or a coin." },

   { e:"🏕️", role:"War Council", x:"The war grinds on. Your army holds the river line at {place}, but supplies run thin and the men run thinner.",
     ch:[ { l:"Strip the treasury for supplies", fx:{G:[-12,-7],A:[7,11],F:[-5,-2]}, o:"Carts roll day and night to the river. The line holds — bought and paid for by the King." },
          { l:"Let them forage and endure", fx:{A:[-9,-5],P:[-6,-3]}, o:"The army eats the countryside and curses the war. The line holds, barely, like a held breath." } ] },
   { e:"🏆", role:"War Council", x:"The final push: {rival}'s host is broken-backed at {place}, one battle from ending it. Your word decides how hard the hammer falls.",
     ch:[ { l:"Crush them utterly", fx:{A:[-8,-4],G:[13,19],P:[6,10]}, o:"The hammer falls. {rival} sues for peace with an empty treasury — which your men carry home for you. The war ends in your name." },
          { l:"Offer generous terms", fx:{G:[6,10],P:[9,13],A:[-4,-1]}, o:"{rival} kneels to generous terms and tells its children the King was merciful AND mighty. A rarer monument than any battlefield." } ] } ] },
 plague: { name:"The Grey Sickness", steps:[
   { e:"🤧", role:"The Physicians", x:"A sickness — grey-faced, quiet, quick — has appeared in {place}. The physicians ask whether to close the roads.",
     ch:[ { l:"Close the roads", fx:{G:[-8,-5],P:[4,7],F:[-5,-2]}, o:"The roads close under your seal. Trade sulks; the sickness, mostly, stays where it started." },
          { l:"Roads stay open", fx:{G:[4,7],P:[-5,-2]}, o:"The carts roll on. So, in a few of them, does something grey and quiet." } ] },
   { e:"🕯️", role:"The Physicians", x:"The Grey Sickness spreads despite everything. The physicians beg a royal decree: the sick housed apart, the dead burned quickly.",
     ch:[ { l:"Issue the decree", fx:{P:[-7,-4],G:[-6,-3]}, o:"The decree goes out in your name and it works the way firebreaks work — cruelly, and just in time." },
          { l:"No decree. We endure", fx:{P:[-10,-6],F:[-6,-3]}, o:"The realm endures the way fields endure hail. What's left standing in spring, we'll see." } ] },
   { e:"🌅", role:"The Physicians", x:"The sickness thins at last. The physicians credit the King's decrees; the priests credit heaven; the people credit whoever fed them.",
     ch:[ { l:"Proclaim a day of thanks", fx:{G:[-6,-3],P:[9,13]}, o:"Bells, bread, and the King's name in every prayer of thanks. The Grey Sickness becomes a story with you at its center." },
          { l:"Just reopen everything", fx:{G:[7,11],P:[3,6]}, o:"Markets burst back like spring water. The sickness fades; the coin returns; the realm exhales." } ] } ] },
 dragon: { name:"The Dragon of {place}", steps:[
   { e:"🐉", role:"The Dragon", x:"Smoke on the horizon of {place}: a dragon — old, winged, and reasonable, its herald says — has taken the old watchtower as its seat.",
     ch:[ { l:"Send an envoy to parley", fx:{G:[-5,-2]}, o:"The envoy returns pale and intact: the dragon wishes to discuss terms. It collects, it seems, more than gold." },
          { l:"Muster the army", fx:{A:[-6,-3],G:[-6,-3]}, o:"The army musters and marches — and receives, mid-march, a courteous letter. In claw-writing. Addressed to the King." } ] },
   { e:"📜", role:"The Dragon", x:"The dragon's terms, delivered in elegant claw: it will guard your border against {rival} forever — for a tithe of gold and one song a year, written new.",
     ch:[ { l:"Accept the dragon's terms", fx:{G:[-9,-5],A:[10,14]}, o:"The tithe is paid, the minstrels are set to work, and your border gains a guardian that makes armies reconsider." },
          { l:"No deals with dragons", fx:{A:[-5,-2],P:[3,6]}, o:"The letter is burned in the square to great applause. The dragon, watching from its tower, applauds too. Slowly." } ] },
   { e:"🔥", role:"The Dragon", x:"The dragon makes its final move: it descends at dawn — not on the villages, but on the army of {rival} massing at your border. Then it looks to the throne, awaiting the King's word.",
     ch:[ { l:"Reward it royally", fx:{G:[-11,-6],A:[8,12],P:[7,11]}, o:"Gold, a tower rebuilt in marble, and the best song of the year. The realm gains the first dragon in history on a king's payroll — YOUR payroll." },
          { l:"Drive it off while it's weak", fx:{A:[-11,-6],P:[-5,-2]}, o:"The attempt costs spears and dignity; the dragon leaves on its own schedule, unhurried, taking the tower's roof as a souvenir." } ] } ] }
};

var ENDINGS = {
 Glow:{ t:"THE EMPTY VAULT", x:"The last coin is spent, the creditors come with carts, and the throne itself is carried out to settle the debts. A king can survive many things. Arithmetic is not one of them." },
 Ghigh:{ t:"BURIED IN GOLD", x:"The treasury overflows into the halls, the kitchens, the chapel. The merchants move in to manage it all, politely, permanently. You are the richest prisoner in the realm — crowned daily, consulted never." },
 Flow:{ t:"THE GREAT HUNGER", x:"First the dogs go quiet. Then the villages. The people leave on foot with their carts and their children, looking for a kingdom where the King remembered bread. Yours becomes a very quiet country." },
 Fhigh:{ t:"THE ENDLESS FEAST", x:"Granaries burst, stores rot faster than they can be eaten, and the rats grow bold, fat, and organized. The realm drowns in plenty while the court argues over whose feast it is." },
 Alow:{ t:"NO BLADES LEFT", x:"With no army left to speak of, the riders come in the first snow and take the capital by spring. They find the crown in good order. It is the kingdom that was missing." },
 Ahigh:{ t:"THE ETERNAL ARMY", x:"Soldiers outnumber plows ten to one, and an army that large eventually asks the obvious question. The generals crown one of their own by midsummer. Your statue makes a fine gatepost." },
 Plow:{ t:"THE SILENT SQUARE", x:"They come at dawn without torches this time — just numbers. The guards step aside like water. The throne room is empty when you reach it, and somehow already dusty." },
 Phigh:{ t:"BELOVED AS A GOD", x:"They build shrines. They stop working to celebrate you. Decisions pile unsigned while the kingdom dances itself into ruin, praising the King at every step down. Worship, it turns out, is not obedience." }
};

var S, stage = document.getElementById("stage");
function saveBest(){
  try{ localStorage.setItem("crownfall_best", String(Math.max(S.best, S.years*4 + S.seasonIdx))); }catch(e){}
}
function reset(){
  S = { m:{G:50,F:50,A:50,P:50}, cardNo:0, seasonIdx:0, best:0, mode:"title", sel:0,
        card:null, lastFx:null, lastOut:"", note:"", arc:null, arcDue:0, arcPlace:null, recentTpl:[], recentRoles:[],
        rival:pick(RIVALS), ending:null, driftNote:"" };
  try{ S.best = parseInt(localStorage.getItem("crownfall_best")||"0",10)||0; }catch(e){}
}
reset();
var SEASONS = ["Spring","Summer","Autumn","Winter"];
function yearOf(){ return Math.floor(S.cardNo/4)+1; }
function seasonOf(){ return SEASONS[S.cardNo%4]; }
function fill(t, ctx){
  return t.replace(/\{name\}/g, ctx.name).replace(/\{place\}/g, ctx.place).replace(/\{rival\}/g, S.rival)
          .replace(/\{crop\}/g, ctx.crop).replace(/\{beast\}/g, ctx.beast);
}
function rollFx(fx){
  var d = {G:0,F:0,A:0,P:0};
  for (var k in fx){ d[k] = ri(fx[k][0], fx[k][1]); }
  return d;
}
function makeCtx(){ return { name: pick(FIRST)+" "+pick(EPITHET), place: pick(PLACES), crop: pick(CROPS), beast: pick(BEASTS) }; }
function buildCard(kind, roleObj, tpl, ctx){
  return { kind:kind, e: roleObj.e, role: roleObj.role, who: ctx.name, x: fill(tpl.x, ctx),
           ch: tpl.ch.map(function(c){ return { l: fill(c.l, ctx), fx: c.fx, o: fill(c.o, ctx) }; }) };
}
function genCard(){
  var ctx = makeCtx(), i, roleObj, tpl;
  // 1) Arc step due?
  if (S.arc){
    if (S.arcDue <= 0){
      var arc = ARCS[S.arc.type];
      tpl = arc.steps[S.arc.step];
      roleObj = { e: tpl.e, role: tpl.role };
      if (S.arcPlace) ctx.place = S.arcPlace;
      return buildCard("arc", roleObj, tpl, ctx);
    }
  }
  // 2) State-triggered card?
  var trig = STATE_CARDS.filter(function(c){ return c.when(S); });
  if (trig.length && Math.random() < 0.45){
    tpl = pick(trig);
    roleObj = { e: tpl.e, role: tpl.role };
    return buildCard("state", roleObj, tpl, ctx);
  }
  // 3) Generic realm event?
  if (Math.random() < 0.16){
    tpl = pick(GENERIC);
    roleObj = { e: tpl.e, role: tpl.role };
    return buildCard("generic", roleObj, tpl, ctx);
  }
  // 4) Normal petitioner — avoid recent roles/templates
  for (i=0;i<6;i++){
    roleObj = pick(ROLES);
    if (S.recentRoles.indexOf(roleObj.role) === -1) break;
  }
  for (i=0;i<6;i++){
    tpl = pick(roleObj.t);
    if (S.recentTpl.indexOf(tpl.x.slice(0,24)) === -1) break;
  }
  S.recentRoles.push(roleObj.role); if (S.recentRoles.length>3) S.recentRoles.shift();
  S.recentTpl.push(tpl.x.slice(0,24)); if (S.recentTpl.length>6) S.recentTpl.shift();
  return buildCard("normal", roleObj, tpl, ctx);
}
function maybeStartArc(){
  if (S.arc || S.cardNo < 6) return;
  if (Math.random() < 0.16){
    var types = ["war","plague","dragon"];
    S.arc = { type: pick(types), step: 0 };
    S.arcPlace = pick(PLACES);
    S.arcDue = ri(1,3);
  }
}
function nextCard(){
  S.card = genCard();
  S.sel = 0;
  S.mode = "card";
  paint();
}
function choose(idx){
  var c = S.card.ch[idx]; if (!c) return;
  var d = rollFx(c.fx);
  S.lastFx = d; S.lastOut = c.o;
  S.m.G += d.G; S.m.F += d.F; S.m.A += d.A; S.m.P += d.P;
  var wasArcStep = (S.card.kind === "arc");
  // season advance + new-year drift
  S.cardNo++;
  S.driftNote = "";
  if (S.cardNo % 4 === 0){
    S.m.F -= 4; S.m.G += 4; S.m.A -= 2;
    S.driftNote = "A new year turns on the King's word — taxes gathered (💰+4), stores eaten (🌾−4), the army's upkeep paid (⚔️−2).";
  }
  if (wasArcStep && S.arc){
    S.arc.step++;
    if (S.arc.step >= ARCS[S.arc.type].steps.length){ S.arc = null; }
    else S.arcDue = ri(2,3);
  } else if (S.arc){
    S.arcDue--;
  }
  maybeStartArc();
  // death check
  var e = null;
  if (S.m.G<=0) e="Glow"; else if (S.m.G>=100) e="Ghigh";
  else if (S.m.F<=0) e="Flow"; else if (S.m.F>=100) e="Fhigh";
  else if (S.m.A<=0) e="Alow"; else if (S.m.A>=100) e="Ahigh";
  else if (S.m.P<=0) e="Plow"; else if (S.m.P>=100) e="Phigh";
  if (e){ S.ending = e; S.years = yearOf(); saveBest(); S.mode = "result"; paint(); return; }
  S.mode = "result";
  paint();
}

// ================= Rendering =================
var MICON = { G:"💰", F:"🌾", A:"⚔️", P:"❤️" };
function metersHTML(){
  var h = '<div class="meters">';
  ["G","F","A","P"].forEach(function(k){
    var v = Math.max(0, Math.min(100, S.m[k]));
    var cls = "fill" + (v<=20 ? " low" : (v>=85 ? " high" : ""));
    h += '<div class="meter"><span>'+MICON[k]+'</span><div class="bar"><div class="'+cls+'" style="width:'+v+'%"></div></div><span class="val">'+S.m[k]+'</span></div>';
  });
  return h + '</div>';
}
function hud(){
  return '<div class="hud"><span>👑 KING REALVON</span><span>Year '+yearOf()+' · '+seasonOf()+'</span></div>';
}
function focusMenu(opts){
  var n = opts.length, cur = opts[S.sel];
  var prev = opts[(S.sel-1+n)%n], next = opts[(S.sel+1)%n];
  return '<div class="focus"><div class="fside" id="fprev">▲ '+prev.label+'</div>' +
    '<div class="fcur" id="fcur">'+cur.label+'</div>' +
    '<div class="fside" id="fnext">▼ '+next.label+'</div>' +
    '<div class="fpos">'+(S.sel+1)+' of '+n+' — swipe to browse, pinch the gold box to decree</div></div>';
}
function singleBtn(label){ return '<div class="opts"><div class="opt sel" id="singlebtn">'+label+'</div></div>'; }
function deltasHTML(d){
  if (!d) return "";
  var parts = [];
  ["G","F","A","P"].forEach(function(k){
    if (d[k]) parts.push('<span class="'+(d[k]>0?"up":"dn")+'">'+MICON[k]+' '+(d[k]>0?"+":"−")+Math.abs(d[k])+'</span>');
  });
  return parts.length ? '<div class="deltas">'+parts.join(" · ")+'</div>' : '<div class="deltas"><span class="small">The realm holds its breath — nothing changes.</span></div>';
}
var menuOpts = [];
function paint(){
  var html = "";
  if (S.mode === "title"){
    var bestY = Math.floor(S.best/4), bestS = S.best%4;
    menuOpts = [ { label:"▶ Take the throne", fn:function(){ nextCard(); } } ];
    html = '<div class="kicker">A Game of Rule</div><h1>CROWNFALL</h1><div class="bigemoji">👑</div>' +
      '<p class="sub">All power flows through the King.</p>' +
      '<p class="body center">Petitioners come to <b>King Realvon</b> — generals, witches, merchants, mothers — and no two are ever alike. Every decree moves your <b>Gold, Food, Army,</b> and <b>People</b>. If any one empties or overflows, your reign ends. Rule as long as you can.</p>' +
      (S.best ? '<p class="body center small">Longest reign so far: <b>'+bestY+' years, '+bestS+' seasons</b></p>' : '') +
      singleBtn("▶ Take the throne");
  } else if (S.mode === "card"){
    var c = S.card;
    menuOpts = c.ch.map(function(ch, i){ return { label: ch.l, fn: (function(j){ return function(){ choose(j); }; })(i) }; });
    html = hud() + metersHTML() +
      '<div class="card"><div class="who"><div class="emo">'+c.e+'</div><div><div class="nm">'+(c.kind==="generic"||c.kind==="state" ? c.role : c.who)+'</div><div class="rl">'+(c.kind==="generic"||c.kind==="state" ? "Petition to the Crown" : c.role+" · petitions the King")+'</div></div></div>' +
      '<div class="ask">'+c.x+'</div></div>' +
      (S.arc && c.kind!=="arc" ? '<div class="note">⚜️ '+fill(ARCS[S.arc.type].name, { name:"", place:(S.arcPlace||""), crop:"", beast:"" })+' continues…</div>' : '') +
      focusMenu(menuOpts) + '<div class="hint">Everything is decided by the King alone.</div>';
  } else if (S.mode === "result"){
    var last = !!S.ending;
    menuOpts = [ { label: last ? "⚰️ See how it ended" : "▶ Next petitioner", fn:function(){
        if (S.ending){ S.mode="over"; paint(); } else nextCard();
      } } ];
    html = hud() + metersHTML() + '<div class="card"><div class="ask">'+S.lastOut+'</div></div>' +
      deltasHTML(S.lastFx) +
      (S.driftNote ? '<div class="note">'+S.driftNote+'</div>' : '') +
      singleBtn(last ? "⚰️ See how it ended" : "▶ Next petitioner");
  } else if (S.mode === "over"){
    var en = ENDINGS[S.ending];
    menuOpts = [ { label:"▶ Rule again", fn:function(){ var b=S.best; reset(); S.best=b; nextCard(); } } ];
    html = '<div class="kicker">The Reign of King Realvon</div><div class="bigemoji">⚰️</div><h2 class="center">'+en.t+'</h2>' +
      '<p class="body center">'+en.x+'</p>' +
      '<p class="body center">You ruled <b>'+Math.floor(S.cardNo/4)+' years and '+(S.cardNo%4)+' seasons</b> — '+S.cardNo+' decrees, every one of them yours.</p>' +
      singleBtn("▶ Rule again");
  }
  stage.innerHTML = html;
  var fc = document.getElementById("fcur"), fp = document.getElementById("fprev"), fn = document.getElementById("fnext"), sb = document.getElementById("singlebtn");
  if (fc) fc.addEventListener("click", function(){ activateMenu(); });
  if (fp) fp.addEventListener("click", function(){ moveSel(-1); });
  if (fn) fn.addEventListener("click", function(){ moveSel(1); });
  if (sb) sb.addEventListener("click", function(){ activateMenu(); });
  fitToLens();
}
function fitToLens(){
  try{ requestAnimationFrame(function(){
    stage.style.transform = "";
    var need = stage.scrollHeight, avail = window.innerHeight || 600;
    if (need > avail){ var sc = Math.max(0.45,(avail/need)*0.99); stage.style.transformOrigin="top center"; stage.style.transform="scale("+sc+")"; }
  }); }catch(e){}
}
function moveSel(d){
  if (!menuOpts.length) return;
  S.sel = (S.sel + d + menuOpts.length) % menuOpts.length;
  paint();
}
function activateMenu(){ var o = menuOpts[S.sel] || menuOpts[0]; if (o && o.fn) o.fn(); }

document.addEventListener("keydown", function(e){
  if (e.key==="ArrowDown" || e.key==="ArrowRight"){ moveSel(1); e.preventDefault(); }
  else if (e.key==="ArrowUp" || e.key==="ArrowLeft"){ moveSel(-1); e.preventDefault(); }
  else if (e.key==="Enter" || e.key===" "){ activateMenu(); e.preventDefault(); }
});
var tx=0, ty=0;
document.addEventListener("touchstart", function(e){ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; }, {passive:true});
document.addEventListener("touchend", function(e){
  var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if (Math.abs(dx)<24 && Math.abs(dy)<24) return;
  if (Math.abs(dy) >= Math.abs(dx)) moveSel(dy<0 ? 1 : -1);
  else moveSel(dx>0 ? 1 : -1);
}, {passive:true});

paint();
</script>
</body>
</html>
