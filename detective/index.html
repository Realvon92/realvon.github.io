<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Night Shift — The Dawson Case · A Detective Game for Ray-Ban Display</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background:#000; color:#f5f0e6; font-family: Georgia, 'Times New Roman', serif; overflow:hidden; }
  #stage { width:600px; height:600px; margin:0 auto; position:relative; padding:20px 30px 14px; display:flex; flex-direction:column; }
  @media (max-width:620px){ #stage{ width:100vw; height:100vh; padding:18px 16px; } }
  .kicker { color:#e8b33c; letter-spacing:3px; font-size:15px; text-transform:uppercase; text-align:center; }
  h1 { font-size:44px; text-align:center; line-height:1.05; margin:10px 0 4px; color:#fff; }
  h2 { font-size:28px; line-height:1.15; margin:6px 0 9px; color:#fff; }
  .sub { text-align:center; color:#bdb49e; font-size:19px; font-style:italic; }
  .body { font-size:22px; line-height:1.32; color:#efe9da; margin:8px 0; }
  .body b { color:#e8b33c; }
  .cluebox { border:2px solid #e8b33c; border-radius:12px; padding:10px 13px; margin:9px 0; background:#141005; }
  .cluebox .ct { color:#e8b33c; font-size:16px; letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
  .cluebox .cb { font-size:20px; line-height:1.28; }
  .liebox { border:2px solid #5ec8e6; border-radius:12px; padding:10px 13px; margin:9px 0; background:#06121a; }
  .liebox .ct { color:#5ec8e6; font-size:16px; letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
  .liebox .cb { font-size:20px; line-height:1.28; color:#eaf7ff; }
  .hud { display:flex; justify-content:space-between; font-size:16px; color:#9d9582; border-bottom:1px solid #333; padding-bottom:7px; margin-bottom:9px; letter-spacing:1px; }
  .hud .gold { color:#e8b33c; }
  .opts { margin-top:auto; display:flex; flex-direction:column; gap:8px; }
  .opt { border:2px solid #3d3d3d; border-radius:12px; padding:10px 13px; font-size:21px; color:#ddd6c4; background:#0a0a0a; cursor:pointer; line-height:1.2; }
  .opt.sel { border-color:#e8b33c; color:#fff; background:#1c1503; }
  .opt.done { opacity:.5; }
  .opt .tick { color:#7fc96b; }
  .hint { text-align:center; color:#77705f; font-size:15px; margin-top:9px; font-style:italic; }
  .bigemoji { text-align:center; font-size:54px; margin:6px 0; }
  .rank { text-align:center; font-size:25px; color:#e8b33c; margin:8px 0; }
  .focus { margin-top:auto; display:flex; flex-direction:column; gap:7px; }
  .fside { text-align:center; color:#8a8271; font-size:19px; padding:5px 10px; cursor:pointer; line-height:1.2; }
  .fcur { border:3px solid #e8b33c; background:#1c1503; color:#fff; border-radius:14px; padding:17px 15px; font-size:26px; text-align:center; cursor:pointer; line-height:1.25; }
  .fpos { text-align:center; color:#77705f; font-size:15px; }
  .center { text-align:center; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
// ================= NIGHT SHIFT: THE DAWSON CASE =================
// A murder case for the Ray-Ban Display. Question the suspects, work the
// scene, collect the evidence — then arrest the killer.
// Controls: Neural Band swipe = move, pinch = select.
// Phone/browser preview: tap, swipe, or Arrow keys + Enter.

var CLUES = {
  key:     "The Other Key — Eli's own key was still in his pocket, and the office was locked. Only two office keys exist. The other one is Ray's.",
  calendar:"The Refused Buyout — Eli's calendar, for Friday: 'Tell Ray — NO deal.' He was never selling his half of the shop.",
  text:    "The Text — 10:47 PM, from Ray: 'On my way. We need to talk tonight.' Ray swore he never contacted Eli that night.",
  inside:  "An Inside Job — no forced entry anywhere on the building. The killer was let in, or carried a key.",
  camera:  "The Truck — lot camera: Ray's truck rolls in at 10:52 PM and out at 11:19 PM. Eli died right inside that window. Nobody else came or went.",
  receipt: "Lena Cleared — her gas-station receipt: coffee on Ramsey St, on camera, 11:05 PM — 25 minutes away, mid-window.",
  witness: "The Witness — Lena came back at 10:43 PM for her purse and watched Ray's truck pull in, lights off. Ray claims he was home by 10:30.",
  cole:    "Cole Cleared — he turned in his shop keys at 9:12 AM when he was fired, and a timestamped cookout video has him across town all night."
};
var TOTAL_CLUES = 8;

var SEARCHES = {
  office: { label:"Search Eli's office", title:"Search: Eli's Office", clues:["key","calendar","text"], pages:[
    "The office door was <b>locked</b> when the call came in. Eli's own office key is still in his pocket. So whoever locked this door used <b>the only other key</b> — and walked out calm.",
    "His desk calendar is open to Friday, in his own hand: <i>'Sign papers? NO. Tell Ray — NO deal. This shop stays mine.'</i> He was never selling. Not at any price.",
    "His phone sits face-down by the desk. Last text, <b>10:47 PM</b>, from his partner Ray: <i>'On my way. We need to talk tonight.'</i>"
  ]},
  bay: { label:"Search the back bay", title:"Search: The Back Bay", clues:["inside"], pages:[
    "You walk every door and window. No pry marks. No cut screens. No broken glass. <b>No forced entry anywhere.</b>",
    "The tools are racked, the lift is down, nothing is stolen. Whoever killed Eli Dawson didn't break in — <b>they belonged here, or they had a key.</b>"
  ]},
  cameras: { label:"Watch the lot cameras", title:"Watch: The Lot Cameras", clues:["camera"], pages:[
    "One camera over the lot. Grainy, but honest. <b>8:40 PM:</b> Lena's sedan pulls out. <b>10:43 PM:</b> the same sedan swings back in for two minutes — then gone. Just like she said.",
    "<b>10:52 PM:</b> a pickup rolls in slow, lights off before it stops. Shop logo on the door. <b>Ray's truck.</b> <b>11:19 PM:</b> it rolls back out.",
    "Between those two timestamps, <b>nobody else comes or goes</b>. And Eli Dawson died between those two timestamps."
  ]}
};

var INTERVIEWS = {
  ray: { label:"Question Ray — the partner", name:"Ray Delgado, 43", role:"Eli's business partner — they built the shop together.",
    intro:"Ray is holding it together a little too well. Coffee untouched. Answers ready before your questions land. He stands to inherit the whole shop — and a partner policy pays out if one of them dies.",
    questions:[
      { q:"\u201CWhere were you last night?\u201D", pages:[
        "\u201CHome. Couch by <b>10:30</b>, asleep before the news ended. Didn't leave, didn't call anybody.\u201D He shrugs. \u201CAsk my dog.\u201D",
        "⚡ <b>Instinct:</b> no pause, no thinking, every detail lined up in a row. Men remembering a real night have to think. Men reciting one don't."
      ]},
      { q:"\u201CHow were things with Eli?\u201D", pages:[
        "\u201CGood. Great, even. He was about to <b>sell me his half</b> — papers Friday. We were finally on the same page.\u201D",
        "He smiles when he says it. If you've read Eli's calendar, you know that smile is standing on air."
      ]},
      { q:"\u201CWhen did you last talk to Eli?\u201D", pages:[
        "\u201CTuesday. Shop stuff.\u201D He holds your eye one second too long. \u201CI had <b>no reason</b> to talk to him last night, detective.\u201D",
        "⚡ <b>Instinct:</b> a partner buyout hanging over the shop — and he had 'no reason' to talk to the man? That sentence was built, not spoken. Find the proof, then come back and press him."
      ]}
    ]},
  lena: { label:"Question Lena — the bookkeeper", name:"Lena Brooks, 39", role:"Bookkeeper at the shop. Eli's ex. She argued with him that evening — half the block heard it.",
    intro:"Lena's eyes are red but her voice is level. \u201CI know how this looks. I yelled at him at 8, and he was dead by 12. So ask me everything, and write it all down.\u201D",
    questions:[
      { q:"\u201CWhy were you at the shop?\u201D", pages:[
        "\u201CPayroll. Eli shorted my last two checks, and I told him to his face. Yeah, we yelled. Then I left. I wanted my money, detective — <b>dead men don't pay</b>.\u201D",
        "⚡ <b>Instinct:</b> true as far as it goes — but there's a hole in her night, a few hours she stepped around like a puddle. Something happened after 8:40 that she didn't say."
      ]},
      { q:"\u201CWhere did you go after?\u201D", pages:[
        "\u201CDrove around mad awhile. Got coffee at the gas station on <b>Ramsey St, 11:05</b>. I keep every receipt — I'm a bookkeeper.\u201D She slides it across the table. Time, date, and the store's camera log all line up — 25 minutes from the shop, mid-window."
      ], clues:["receipt"]},
      { q:"\u201CDid you see anyone that night?\u201D", pages:[
        "\u201CI'd left my purse in my car. Came back at <b>10:43</b> to grab it — and watched <b>Ray's truck</b> pull in, lights off. Figured it was partner business. I got out of there.\u201D",
        "\u201CHe told you he was home at 10:30, didn't he? Yeah. He would.\u201D"
      ], clues:["witness"]}
    ]},
  cole: { label:"Question Cole — the fired mechanic", name:"Cole Mercer, 22", role:"Mechanic. Eli fired him that morning, in front of customers. He told Eli he'd regret it.",
    intro:"Cole hasn't slept. \u201CI know what I said. Everybody heard me say it. But I didn't — I wouldn't — man, just ask your questions.\u201D",
    questions:[
      { q:"\u201CWhy did Eli fire you?\u201D", pages:[
        "\u201CSaid I was late three times. I was. My little girl's been sick — urgent care half the nights. He didn't care. Yeah, I lost it on him.\u201D"
      ]},
      { q:"\u201CYou said he'd regret it.\u201D", pages:[
        "\u201CI meant the <b>labor board</b>. I filed that same afternoon. You don't hurt a man you're suing — he has to be alive and writing checks to lose.\u201D",
        "The records back him twice: desk log shows his <b>shop keys turned in at 9:12 AM</b>, and his sister's cookout video — timestamped, across town, 9 PM to midnight — has him at the grill all night."
      ], clues:["cole"]},
      { q:"\u201CWho'd want Eli dead?\u201D", pages:[
        "\u201CFollow the money, detective. Eli told me himself last week: Ray's been pushing the buyout hard, and if one partner dies, the other gets the shop <b>and</b> the payout. Ask Ray about Friday.\u201D"
      ]}
    ]}
};

// Press scenes: confront a suspect with proof. needs = clue id required to unlock.
// Every press has a deflection (blame shifted to someone else) and a story change.
var PRESS = {
  ray: [
    { id:"p_ray_truck", needs:"camera", label:"⚡ Press him: the truck", pages:[
      "You put the camera stills on the table. <b>10:52 PM</b> in. <b>11:19 PM</b> out. His truck. His logo. He stares a long time. \u201CThat's not — look, you want to be talking to <b>Cole</b>. Kid had it out for Eli, the whole shop heard him threaten\u2014\u201D",
      "\u201CThe truck, Ray.\u201D And the story changes, right in front of you: \u201C…Okay. I was there. I went to talk him out of killing the buyout. He was <b>alive when I left</b>, I swear it. We argued. That's all.\u201D",
      '<div class="liebox"><div class="ct">⚡ Lie caught</div><div class="cb">"Home by 10:30, never left." He was at the shop, inside the death window — and his first move was to throw a 22-year-old under the bus. Story #2 already reads different from story #1.</div></div>'
    ]},
    { id:"p_ray_text", needs:"text", label:"⚡ Press him: the text", pages:[
      "You slide the phone across. <b>10:47 PM</b>. <i>'On my way. We need to talk tonight.'</i> — from his number. \u201CThat's… an old draft. It must have sent late, or the phone\u2014\u201D",
      "\u201CDrafts don't send themselves, Ray.\u201D His shoulders drop an inch. \u201CFine. I texted him. I went over to <b>beg</b> him not to kill the deal. That's ALL it was.\u201D",
      '<div class="liebox"><div class="ct">⚡ Lie caught</div><div class="cb">"No reason to talk to him last night." He texted a dead man ten minutes before driving to see him. The story keeps changing — and it only changes when you\'re holding the proof.</div></div>'
    ]}
  ],
  lena: [
    { id:"p_lena_return", needs:"camera", label:"⚡ Press her: the return", pages:[
      "\u201CYou told me you left at 8:40, Lena. You didn't mention <b>10:43</b>.\u201D The camera still: her sedan, back in the lot. Her face does the math on how bad it looks.",
      "\u201CI came back for my purse — I was scared you'd think… I <i>know</i> how it looks! But I saw <b>Ray's truck</b> roll in as I was leaving. And if you're looking at somebody, look at Cole — he told the whole shop Eli would 'pay.' Everybody heard it.\u201D",
      '<div class="liebox"><div class="ct">⚡ Lie caught</div><div class="cb">The omission. She hid the return because it put her inside the window. Scared isn\'t the same as guilty — and notice how the blame lands on the kid, while everything she actually saw points at Ray.</div></div>'
    ]}
  ],
  cole: [
    { id:"p_cole_fire", needs:null, label:"⚡ Press him: the firing", pages:[
      "\u201CYou said Eli fired you in his office. Three people told me it was on the shop floor — in front of customers.\u201D Cole goes red all the way to his ears.",
      "\u201C…Yeah. Okay. I lied about that part. It was humiliating, man. I kicked his truck on my way out — cracked a taillight lens. That's mine, I'll pay for it. But that's ALL that's mine. Ray stood in the doorway laughing while it happened, by the way. Partners, right?\u201D",
      '<div class="liebox"><div class="ct">⚡ Lie caught</div><div class="cb">A pride lie, not a murder lie. He hid the embarrassing part, not a deadly one. Half this job is knowing the difference — and his deflection at Ray costs him nothing to make.</div></div>'
    ]}
  ]
};
var TOTAL_LIES = 4;

var SUSPECTS = [
  { id:"ray",  label:"Arrest Ray Delgado — the partner" },
  { id:"lena", label:"Arrest Lena Brooks — the bookkeeper" },
  { id:"cole", label:"Arrest Cole Mercer — the mechanic" }
];

// ================= Engine =================
var S, stage = document.getElementById("stage"), currentOpts = [];
function reset(){
  S = { clues:{}, searchesDone:{}, asked:{ ray:{}, lena:{}, cole:{} }, metSuspect:{}, pressed:{}, lies:0, sel:0, run:null, ivId:null };
}
reset();
function clueCount(){ return Object.keys(S.clues).length; }
function hud(){
  return '<div class="hud"><span>THE DAWSON CASE</span><span>EVIDENCE <span class="gold">'+clueCount()+' / '+TOTAL_CLUES+'</span> · LIES <span class="gold">'+S.lies+' / '+TOTAL_LIES+'</span></span></div>';
}
var lastRender = null;
function render(html, opts){
  currentOpts = opts || [];
  lastRender = { html:html, opts:currentOpts };
  var menuHtml;
  if (currentOpts.length <= 1){
    menuHtml = '<div class="opts">' + currentOpts.map(function(o,i){
      return '<div class="opt sel" data-i="'+i+'">'+o.label+'</div>'; }).join("") + '</div>';
  } else {
    var n = currentOpts.length, cur = currentOpts[S.sel];
    var prev = currentOpts[(S.sel-1+n)%n], next = currentOpts[(S.sel+1)%n];
    menuHtml = '<div class="focus">' +
      '<div class="fside" id="fprev">▲ '+prev.label+'</div>' +
      '<div class="fcur" id="fcur">'+cur.label+'</div>' +
      '<div class="fside" id="fnext">▼ '+next.label+'</div>' +
      '<div class="fpos">'+(S.sel+1)+' of '+n+' — swipe to browse, pinch the gold box to choose</div></div>';
  }
  stage.innerHTML = html + menuHtml + '<div class="hint">Swipe to move · Pinch / tap to choose</div>';
  Array.prototype.forEach.call(stage.querySelectorAll(".opt"), function(el){
    el.addEventListener("click", function(){ S.sel=parseInt(el.getAttribute("data-i"),10); activate(); });
  });
  var fp = document.getElementById("fprev"), fc = document.getElementById("fcur"), fn = document.getElementById("fnext");
  if (fp) fp.addEventListener("click", function(){ move(-1); });
  if (fn) fn.addEventListener("click", function(){ move(1); });
  if (fc) fc.addEventListener("click", function(){ activate(); });
  fitToLens();
}
// Shrink the whole stage if content is taller than the visible lens area
// (e.g. when the glasses' text size is turned up) so nothing is cut off.
function fitToLens(){
  try{
    requestAnimationFrame(function(){
      stage.style.transform = "";
      var need = stage.scrollHeight, avail = window.innerHeight || 600;
      if (need > avail){
        var sc = Math.max(0.45, (avail/need)*0.99);
        stage.style.transformOrigin = "top center";
        stage.style.transform = "scale("+sc+")";
      }
    });
  }catch(e){}
}
function clueBoxes(ids){
  var fresh = ids.filter(function(id){ return !S.clues[id]; });
  if (!fresh.length) return "";
  return '<div class="cluebox"><div class="ct">🔎 Evidence logged</div>' +
    fresh.map(function(id){ return '<div class="cb" style="margin:6px 0">'+CLUES[id]+'</div>'; }).join("") +
    '</div>';
}
// Page runner: pages -> then onDone()
function runPages(title, pages, clues, onDone){
  S.run = { title:title, pages:pages, clues:clues||[], i:0, onDone:onDone };
  showRunPage();
}
function showRunPage(){
  var r = S.run, last = r.i === r.pages.length-1;
  var html = hud() + '<h2>'+r.title+'</h2><p class="body">'+r.pages[r.i]+'</p>';
  if (last) html += clueBoxes(r.clues);
  S.sel = 0;
  render(html, [ { label: last ? "Done →" : "Continue →", fn:function(){
    if (!last){ r.i++; showRunPage(); }
    else { r.clues.forEach(function(id){ S.clues[id]=true; }); var d=r.onDone; S.run=null; d(); }
  } } ]);
}
function showTitle(){
  S.sel=0;
  render('<div class="kicker">A Detective Case</div><h1>NIGHT<br>SHIFT</h1><div class="bigemoji">🔎</div>' +
    '<div class="sub">The Dawson Case — Fayetteville, NC</div>' +
    '<p class="body center" style="margin-top:16px">A shop owner, murdered in his locked office.<br>Three suspects. Question them all.<br><b>Arrest the real killer.</b></p>',
    [ { label:"▶ Open the case file", fn:showBrief } ]);
}
function showBrief(){
  S.sel=0;
  render(hud() + '<h2>The Case</h2>' +
    '<p class="body"><b>Eli Dawson, 41</b>, owner of Dawson\'s Auto &amp; Tire off Bragg Blvd, was found dead in his locked office just after <b>11 PM</b>. Nobody broke in. Somebody he knew did this.</p>' +
    '<p class="body">Work it your way: search the shop, pull the cameras, and <b>question all three suspects</b>. Trust your ⚡ <b>instinct</b> when it flags a lie — then find the proof and <b>press them with it</b>. They\'ll deflect, throw each other under the bus, and change their stories. Catch enough lies, and a guilty man breaks. Then make the arrest.</p>',
    [ { label:"Start investigating →", fn:showHub } ]);
}
function showHub(){
  var opts = [];
  Object.keys(SEARCHES).forEach(function(id){
    var done = !!S.searchesDone[id];
    opts.push({ label:(done?'<span class="tick">✓</span> ':'')+SEARCHES[id].label, cls:done?"done":"", fn:(function(x){ return function(){ openSearch(x); }; })(id) });
  });
  Object.keys(INTERVIEWS).forEach(function(id){
    var met = !!S.metSuspect[id];
    opts.push({ label:(met?'<span class="tick">✓</span> ':'')+INTERVIEWS[id].label, cls:met?"done":"", fn:(function(x){ return function(){ openInterview(x); }; })(id) });
  });
  opts.push({ label:"🚔 Arrest a suspect", fn:showArrest });
  if (S.sel >= opts.length) S.sel = 0;
  render(hud() + '<h2>Where to, Detective?</h2>', opts);
}
function openSearch(id){
  var n = SEARCHES[id];
  runPages(n.title, n.pages, n.clues, function(){ S.searchesDone[id]=true; showHub(); });
}
function openInterview(id){
  S.ivId = id;
  if (!S.metSuspect[id]){
    var iv = INTERVIEWS[id];
    runPages("Interview: "+iv.name, [ "<b>"+iv.name+"</b> — "+iv.role, iv.intro ], [], function(){ S.metSuspect[id]=true; showQuestions(); });
  } else showQuestions();
}
function showQuestions(){
  var id = S.ivId, iv = INTERVIEWS[id];
  var opts = iv.questions.map(function(q, qi){
    var asked = !!S.asked[id][qi];
    return { label:(asked?'<span class="tick">✓</span> ':'')+q.q, cls:asked?"done":"", fn:function(){
      runPages("Asking "+iv.name.split(",")[0], q.pages, q.clues||[], function(){ S.asked[id][qi]=true; showQuestions(); });
    } };
  });
  (PRESS[id]||[]).forEach(function(p){
    var done = !!S.pressed[p.id], unlocked = !p.needs || !!S.clues[p.needs];
    if (done){
      opts.push({ label:'<span class="tick">✓</span> '+p.label, cls:"done", fn:function(){
        runPages("Pressing "+iv.name.split(",")[0], p.pages, [], function(){ showQuestions(); });
      } });
    } else if (unlocked){
      opts.push({ label:p.label, fn:function(){
        runPages("Pressing "+iv.name.split(",")[0], p.pages, [], function(){ S.pressed[p.id]=true; S.lies++; showQuestions(); });
      } });
    } else {
      opts.push({ label:"🔒 "+p.label.replace("⚡ ","")+" — find the proof first", cls:"done", fn:showQuestions });
    }
  });
  opts.push({ label:"← Back to the board", fn:showHub });
  if (S.sel >= opts.length) S.sel = 0;
  render(hud() + '<h2>Questioning: '+iv.name+'</h2><p class="body">Pick your question.</p>', opts);
}
function showArrest(){
  S.sel = 0;
  var warn = clueCount() < 5
    ? '<p class="body" style="color:#e8b33c">You hold '+clueCount()+' of '+TOTAL_CLUES+' pieces of evidence. You can arrest now — but a thin case can fall apart in court.</p>'
    : '<p class="body">You hold '+clueCount()+' of '+TOTAL_CLUES+' pieces of evidence. Put the cuffs on the killer.</p>';
  var opts = SUSPECTS.map(function(s){ return { label:s.label, fn:function(){ finish(s.id); } }; });
  opts.push({ label:"← Keep investigating", fn:showHub });
  render(hud() + '<h2>Who killed Eli Dawson?</h2>' + warn, opts);
}
function finish(suspectId){
  var n = clueCount(), correct = (suspectId==="ray"), title, body, rank;
  if (correct && n>=7 && S.lies>=3){
    title="KILLER BROKEN IN THE BOX"; rank="★ Rank: World's Best Detective";
    body="You didn't just build the case — you dismantled the man. Every lie Ray Delgado told, you were already holding the proof: the truck, the text, the story that changed every time you set a new page on the table. He blamed a kid. He rewrote his night twice. And then he ran out of versions. The confession takes eleven minutes. Eli's shop stays in Eli's name — and there's a new story they tell at the precinct about the detective nobody can lie to.";
  } else if (correct && n>=7){
    title="KILLER BOOKED"; rank="★ Rank: Sharp-Eye Detective";
    body="Text at 10:47. Truck at 10:52. A witness who saw it. A door locked with his key, a buyout Eli had already refused, and a payout waiting on a death. You set it all on the table, one page at a time — and Ray Delgado stops smiling. He confesses before the recorder's light goes red. Eli's shop stays in Eli's name.";
  } else if (correct && n>=5){
    title="ARRESTED — ON A SHAKY CASE"; rank="★ Rank: Solid Detective";
    body="It's enough to charge Ray Delgado, and he knows it — the lies crack in the interview room. But the DA is sweating the gaps. One or two more pieces of evidence and this would have been airtight before it ever saw a jury.";
  } else if (correct){
    title="RIGHT MAN — CASE COLLAPSED"; rank="★ Rank: Thin Case";
    body="Your gut named Ray Delgado, and your gut was right. But gut isn't evidence. With almost nothing collected, his lawyer takes the case apart in a week, the charges drop, and Ray sells the shop and the story with it. You knew. You couldn't prove it.";
  } else {
    title="WRONG ARREST — KILLER WALKS"; rank="★ Rank: Cold Trail";
    body="The cuffs go on the wrong person, and while the department untangles that, Ray Delgado quietly lists the shop, collects on the partnership, and disappears into a new name two states away. Eli Dawson doesn't get justice. Not this time.";
  }
  S.sel = 0;
  render(hud() + '<div class="bigemoji">'+(correct?"🕵️":"🧊")+'</div><h2 class="center">'+title+'</h2>' +
    '<p class="body">'+body+'</p><p class="rank">'+rank+'</p>' +
    '<p class="body center">Evidence collected: '+n+' / '+TOTAL_CLUES+' · Lies caught: '+S.lies+' / '+TOTAL_LIES+'</p>',
    [ { label:"↻ Work the case again", fn:function(){ reset(); showTitle(); } } ]);
  try{ localStorage.setItem("nightshift_dawson_rank", rank+" ("+n+"/"+TOTAL_CLUES+")"); }catch(e){}
}
// ================= Input =================
function activate(){ var o = currentOpts[S.sel]; if (o && o.fn) o.fn(); }
function move(d){
  if (!currentOpts.length) return;
  S.sel = (S.sel + d + currentOpts.length) % currentOpts.length;
  if (lastRender) render(lastRender.html, lastRender.opts);
}
document.addEventListener("keydown", function(e){
  if (e.key==="ArrowDown" || e.key==="ArrowRight"){ move(1); e.preventDefault(); }
  else if (e.key==="ArrowUp" || e.key==="ArrowLeft"){ move(-1); e.preventDefault(); }
  else if (e.key==="Enter" || e.key===" "){ activate(); e.preventDefault(); }
});
var tx=0, ty=0;
document.addEventListener("touchstart", function(e){ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; }, {passive:true});
document.addEventListener("touchend", function(e){
  var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if (Math.abs(dy)>48 && Math.abs(dy)>Math.abs(dx)){ move(dy<0?1:-1); }
}, {passive:true});

showTitle();
</script>
</body>
</html>
