<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Night Shift — A Detective Case for Ray-Ban Display</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background:#000; color:#f5f0e6; font-family: Georgia, 'Times New Roman', serif; overflow:hidden; }
  #stage { width:600px; height:600px; margin:0 auto; position:relative; padding:34px 40px; display:flex; flex-direction:column; }
  @media (max-width:620px){ #stage{ width:100vw; height:100vh; padding:22px 20px; } }
  .kicker { color:#e8b33c; letter-spacing:3px; font-size:17px; text-transform:uppercase; text-align:center; }
  h1 { font-size:52px; text-align:center; line-height:1.05; margin:14px 0 6px; color:#fff; }
  h2 { font-size:34px; line-height:1.15; margin:8px 0 12px; color:#fff; }
  .sub { text-align:center; color:#bdb49e; font-size:21px; font-style:italic; }
  .body { font-size:26px; line-height:1.38; color:#efe9da; margin:10px 0; }
  .body b { color:#e8b33c; }
  .cluebox { border:2px solid #e8b33c; border-radius:14px; padding:16px 18px; margin:14px 0; background:#141005; }
  .cluebox .ct { color:#e8b33c; font-size:19px; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; }
  .cluebox .cb { font-size:25px; line-height:1.32; }
  .hud { display:flex; justify-content:space-between; font-size:19px; color:#9d9582; border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:12px; letter-spacing:1px; }
  .hud .gold { color:#e8b33c; }
  .opts { margin-top:auto; display:flex; flex-direction:column; gap:12px; }
  .opt { border:2px solid #3d3d3d; border-radius:14px; padding:15px 18px; font-size:26px; color:#ddd6c4; background:#0a0a0a; cursor:pointer; line-height:1.2; }
  .opt.sel { border-color:#e8b33c; color:#fff; background:#1c1503; }
  .opt.done { opacity:.45; }
  .opt .tick { color:#7fc96b; }
  .hint { text-align:center; color:#77705f; font-size:18px; margin-top:14px; font-style:italic; }
  .bigemoji { text-align:center; font-size:74px; margin:8px 0; }
  .rank { text-align:center; font-size:30px; color:#e8b33c; margin:10px 0; }
  .center { text-align:center; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
// ============ NIGHT SHIFT — a detective case built for the Ray-Ban Display ============
// Controls: Neural Band swipe = move, pinch = select.
// Phone/browser preview: tap, swipe, or Arrow keys + Enter.

var CLUES = {
  key:   "Key, Not Force — the display case was opened cleanly with a key. No break-in.",
  mud:   "Cut Tread — a fresh muddy print by the back door: size 9, with a diagonal cut in the tread.",
  alarm: "Alarm Log — the alarm was disarmed at 11:42 PM with Marcus's own code, and never set at 11:30 like he claimed.",
  camera:"Empty Aisle — front cameras show the store dark and empty 11:40 PM–12:10 AM. A sedan with its left taillight out left the lot at 12:03 AM.",
  slip:  "The Slip — Marcus said he 'never goes near the back room,' then described the prototype's blue foam. That detail was never released.",
  tail:  "Taillight & Timeline — Tanya: Marcus's left taillight has been out for weeks, and his car was still in the lot at 12:05 AM, when he claims he was home.",
  offer: "Cash Offer — two days before the theft, Marcus quietly offered Dev 'something rare, cash only.'"
};
var TOTAL_CLUES = 7;

var S;
function reset(){
  S = { mode:"title", sel:0, page:0, node:null, clues:{}, done:{}, ending:null };
}
reset();

function clueCount(){ return Object.keys(S.clues).length; }
function giveClue(id){ S.clues[id]=true; }

// Investigation nodes: pages = array of HTML strings. Last page shows the clue box if clue set.
var NODES = {
  scene: { title:"Search: The Case & Back Door", clue:"key", pages:[
    "The <b>Pixel Vault</b> game shop, Skibo Road. Overnight, somebody took the shop's crown jewel: a one-of-a-kind <b>prototype console</b>, locked in a glass case in the back room.",
    "You check the case first. No smashed glass. No pried lock. The case was <b>opened with a key</b> — calmly, by somebody who belonged here.",
    "At the back door: one fresh print in the red mud outside. You photograph it before it dries."
  ], clue2:"mud" },
  office: { title:"Search: The Office & Alarm Log", clue:"alarm", pages:[
    "The office is small: a desk, the alarm panel printout, and a hook where the <b>spare case key</b> hangs. The spare is still there — so the thief used an original.",
    "The alarm log is the loudest thing in the room. The alarm was <b>never set at 11:30 PM</b>, when clerk Marcus Webb says he locked up and left.",
    "It was <b>disarmed at 11:42 PM — with Marcus's personal code</b> — and set again at 12:07 AM. Somebody came back. Or never left."
  ]},
  cameras: { title:"Watch: The Camera Footage", clue:"camera", pages:[
    "Marcus told the owner he spent the slow last hour <b>restocking the front aisles</b>. You pull the front camera for 11:40 PM to 12:10 AM.",
    "Dark. Empty. Not one frame of Marcus, or anybody, in the front of the store. His story just lost its floor.",
    "The lot camera catches one thing at <b>12:03 AM</b>: a dark sedan backing out — <b>left taillight out</b>. Plates covered in mud."
  ]},
  marcus: { title:"Interview: Marcus Webb, Clerk", clue:"slip", pages:[
    "Marcus, 24, works the register and closes alone. Hands shaking. He owes <b>$900 on a repair for his Sonata</b> — he tells you that himself, like it explains the shaking.",
    "\u201CI locked up at 11:30, set the alarm, went home. I never go near the back room — that's Rosa's thing, with the case and the <b>blue foam</b> it sits in.\u201D",
    "Stop. The prototype's <b>blue foam</b> was never in the press, never in the listing, never said out loud tonight. He just told on himself — a little."
  ]},
  tanya: { title:"Interview: Tanya Ruiz, Driver", clue:"tail", pages:[
    "Tanya, 31, runs the delivery route. Her van's GPS puts her in <b>Raleigh by midnight</b> — the shop's 11:51 PM delivery-dock ping was her scheduled drop, logged and gone by 11:20.",
    "\u201CYou want a detail? Marcus's sedan — that <b>left taillight's been out for weeks</b>. We tease him about it. And his car was still in the lot when I rolled past at five after twelve.\u201D",
    "Her boots are size 8, clean, and dry. Nothing about Tanya fits the back door. You cross her off — for now."
  ] },
  dev: { title:"Interview: Dev Okafor, Collector", clue:"offer", pages:[
    "Dev, 28, is the obvious suspect: the collector who posted he'd <b>'pay anything'</b> for that prototype. He doesn't even get nervous.",
    "\u201CDetective, I was live. Eleven to two, streaming, four hundred people in chat, timestamped. Check it.\u201D You do. He's telling the truth — Dev never left his desk.",
    "Then he leans in. \u201CBut ask Marcus why, two days ago, he offered me <b>'something rare, cash only, no receipt.'</b> I said no. Felt dirty.\u201D"
  ]}
};
var HUB_ACTIONS = [
  { id:"scene",   label:"Search the case & back door" },
  { id:"office",  label:"Search the office & alarm log" },
  { id:"cameras", label:"Watch the camera footage" },
  { id:"marcus",  label:"Interview Marcus — the clerk" },
  { id:"tanya",   label:"Interview Tanya — the driver" },
  { id:"dev",     label:"Interview Dev — the collector" },
  { id:"accuse",  label:"⚖️ Make your accusation" }
];

var SUSPECTS = [
  { id:"marcus", label:"Marcus Webb — the clerk" },
  { id:"tanya",  label:"Tanya Ruiz — the driver" },
  { id:"dev",    label:"Dev Okafor — the collector" }
];

// ============ Rendering ============
var stage = document.getElementById("stage");
var currentOpts = []; // [{label, cls, fn}]

function hud(){
  return '<div class="hud"><span>NIGHT SHIFT</span><span>CLUES <span class="gold">'+clueCount()+' / '+TOTAL_CLUES+'</span></span></div>';
}
function render(html, opts){
  currentOpts = opts || [];
  stage.innerHTML = html + '<div class="opts">' +
    currentOpts.map(function(o,i){ return '<div class="opt'+(i===S.sel?' sel':'')+(o.cls?' '+o.cls:'')+'" data-i="'+i+'">'+o.label+'</div>'; }).join("") +
    '</div>' + '<div class="hint">Swipe to move · Pinch / tap to choose</div>';
  Array.prototype.forEach.call(stage.querySelectorAll(".opt"), function(el){
    el.addEventListener("click", function(){ S.sel = parseInt(el.getAttribute("data-i"),10); activate(); });
  });
}

function showTitle(){
  S.mode="title"; S.sel=0;
  render(
    '<div class="kicker">A Detective Case</div><h1>NIGHT<br>SHIFT</h1>' +
    '<div class="bigemoji">🔎</div>' +
    '<div class="sub">The Skibo Road Case — Fayetteville, NC</div>' +
    '<p class="body center" style="margin-top:18px">A rare prototype console, gone overnight.<br>No break-in. Three suspects. One liar.</p>',
    [ { label:"▶ Start the case", fn:showBrief } ]
  );
}
function showBrief(){
  S.mode="story"; S.sel=0;
  render( hud() +
    '<h2>The Briefing</h2>' +
    '<p class="body">Rosa, the owner, found the case empty at 7 AM. The prototype is worth <b>$18,000</b> to the right buyer — and it can\'t be replaced.</p>' +
    '<p class="body">Work the case your way: search, watch, interview. Collect clues. When you\'re ready, accuse. Accuse thin, and a guilty man may walk.</p>',
    [ { label:"Begin investigating →", fn:showHub } ]
  );
}
function showHub(){
  S.mode="hub";
  if (S.sel >= HUB_ACTIONS.length) S.sel = 0;
  var opts = HUB_ACTIONS.map(function(a){
    var done = !!S.done[a.id];
    return { label:(done?'<span class="tick">✓</span> ':'')+a.label, cls:done?"done":"", fn:function(){ openAction(a.id); } };
  });
  render( hud() + '<h2>Where to, Detective?</h2>' +
    '<p class="body">Pick your next move. Re-checking a spot is fine — clues don\'t move.</p>', opts);
}
function openAction(id){
  if (id==="accuse"){ showAccuse(); return; }
  var node = NODES[id];
  S.node = node; S.nodeId = id; S.page = 0; S.mode="node";
  showNodePage();
}
function showNodePage(){
  var node = S.node, last = S.page === node.pages.length-1;
  var html = hud() + '<h2>'+node.title+'</h2>' + '<p class="body">'+node.pages[S.page]+'</p>';
  if (last && node.clue && !S.done[S.nodeId]){
    html += '<div class="cluebox"><div class="ct">🔎 Clue found</div><div class="cb">'+CLUES[node.clue]+'</div></div>';
    if (node.clue2){ html += '<div class="cluebox"><div class="ct">🔎 Clue found</div><div class="cb">'+CLUES[node.clue2]+'</div></div>'; }
  }
  if (last && S.done[S.nodeId]){
    html += '<p class="body" style="color:#9d9582"><i>You\'ve already worked this one over.</i></p>';
  }
  S.sel = 0;
  render(html, [ { label: last ? "Back to the board →" : "Continue →", fn:function(){
    if (!last){ S.page++; showNodePage(); }
    else {
      if (!S.done[S.nodeId]){
        if (node.clue) giveClue(node.clue);
        if (node.clue2) giveClue(node.clue2);
        S.done[S.nodeId]=true;
      }
      showHub();
    }
  } } ]);
}
function showAccuse(){
  S.mode="accuse"; S.sel=0;
  var warn = clueCount() < 5
    ? '<p class="body" style="color:#e8b33c">You hold '+clueCount()+' of '+TOTAL_CLUES+' clues. You can accuse now — but a thin case may not stick.</p>'
    : '<p class="body">You hold '+clueCount()+' of '+TOTAL_CLUES+' clues. Time to put a name on it.</p>';
  var opts = SUSPECTS.map(function(s){ return { label:s.label, fn:function(){ finish(s.id); } }; });
  opts.push({ label:"← Keep investigating", fn:showHub });
  render( hud() + '<h2>Who took the prototype?</h2>' + warn, opts);
}
function finish(suspectId){
  var n = clueCount(), correct = (suspectId==="marcus"), title, body, rank;
  if (correct && n>=6){
    title="CASE CLOSED"; rank="★ Rank: Sharp-Eye Detective";
    body="You lay it out piece by piece — the key, the cut tread, the alarm log, the empty aisle, the slip about the foam, the cash offer. Marcus folds before you finish. The prototype is in a storage unit off Bragg Blvd, wrapped in that same blue foam.";
  } else if (correct && n>=4){
    title="CASE CLOSED — BARELY"; rank="★ Rank: Solid Detective";
    body="The evidence you have is enough to sweat him, and Marcus breaks in the interview room: his code, his car, his $900 debt. Case closed — but one more clue would have made it airtight before a jury.";
  } else if (correct){
    title="RIGHT MAN — CASE DISMISSED"; rank="★ Rank: Lucky Guess";
    body="Your gut said Marcus, and your gut was right. But gut isn't evidence. With almost nothing collected, his lawyer eats the case alive, and the prototype sells two states away. You knew. You couldn't prove it.";
  } else {
    title="CASE COLD"; rank="★ Rank: Cold Trail";
    body="You put the cuffs on the wrong person. By the time the mistake surfaces, the prototype is gone, the real thief is paid, and Rosa's shop eats an $18,000 loss. The board goes quiet. This one will sit in the drawer.";
  }
  S.mode="end"; S.sel=0;
  render( hud() +
    '<div class="bigemoji">'+(correct?"🕵️":"🧊")+'</div>' +
    '<h2 class="center">'+title+'</h2>' +
    '<p class="body">'+body+'</p>' +
    '<p class="rank">'+rank+'</p>' +
    '<p class="body center">Clues collected: '+n+' / '+TOTAL_CLUES+'</p>',
    [ { label:"↻ Play it again", fn:function(){ reset(); showTitle(); } } ]
  );
  try{ localStorage.setItem("nightshift_last_rank", rank+" ("+n+"/"+TOTAL_CLUES+")"); }catch(e){}
}

// ============ Input ============
function activate(){
  var o = currentOpts[S.sel];
  if (o && o.fn) o.fn();
}
function move(d){
  if (!currentOpts.length) return;
  S.sel = (S.sel + d + currentOpts.length) % currentOpts.length;
  // re-render current screen cheaply by re-dispatching: we keep last render fn per mode
  refreshSel();
}
function refreshSel(){
  Array.prototype.forEach.call(stage.querySelectorAll(".opt"), function(el, i){
    if (i===S.sel) el.classList.add("sel"); else el.classList.remove("sel");
  });
}
document.addEventListener("keydown", function(e){
  if (e.key==="ArrowDown" || e.key==="ArrowRight"){ move(1); e.preventDefault(); }
  else if (e.key==="ArrowUp" || e.key==="ArrowLeft"){ move(-1); e.preventDefault(); }
  else if (e.key==="Enter" || e.key===" "){ activate(); e.preventDefault(); }
});
var tx=0, ty=0;
document.addEventListener("touchstart", function(e){ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; }, {passive:true});
document.addEventListener("touchend", function(e){
  var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if (Math.abs(dy)>48 && Math.abs(dy)>Math.abs(dx)){ move(dy<0?1:-1); }
}, {passive:true});

showTitle();
</script>
</body>
</html>
