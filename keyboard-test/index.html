<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Keyboard Test — Von's Display</title>
<style>
  :root{ --gold:#f5c542; --ink:#f2ead8; --dim:#9b8f7a; --panel:#171310; --line:#3a2f22; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#0b0908; color:var(--ink);
    font-family:Georgia,'Times New Roman',serif; }
  #app{ height:100%; display:flex; flex-direction:column; padding:14px 16px; gap:9px; }
  h1{ font-size:24px; color:var(--gold); letter-spacing:1px; text-align:center; }
  .stamp{ text-align:center; font-size:12px; color:var(--dim); letter-spacing:2px; }
  .how{ font-size:15px; color:var(--ink); text-align:center; line-height:1.35; }
  label{ font-size:13px; color:var(--dim); letter-spacing:1px; }
  input[type=text], textarea{
    width:100%; background:var(--panel); color:var(--ink);
    border:2px solid var(--line); border-radius:12px;
    font-family:inherit; padding:10px 12px; outline:none;
  }
  input[type=text]{ font-size:26px; }
  textarea{ font-size:20px; height:64px; resize:none; }
  input[type=text]:focus, textarea:focus, button:focus{
    border-color:var(--gold); box-shadow:0 0 0 3px rgba(245,197,66,.55); }
  .receivedBox{ background:#100d0a; border:1px solid var(--line); border-radius:12px; padding:9px 12px; }
  .receivedBox .cap{ font-size:12px; color:var(--dim); letter-spacing:1px; }
  #received{ font-size:27px; color:var(--gold); word-break:break-word; min-height:34px; line-height:1.2; }
  #meta{ font-size:13px; color:var(--dim); }
  #log{ font-size:12.5px; color:var(--dim); line-height:1.5; min-height:56px; white-space:pre-line; }
  button{
    background:var(--panel); color:var(--gold); border:2px solid var(--gold);
    border-radius:12px; font-family:inherit; font-size:19px; padding:9px 0; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <h1>⌨️ KEYBOARD TEST</h1>
  <div class="stamp">BUILD KBT-1 · NOV 5</div>
  <div class="how">Select a field below. The glasses should open the<br><b>keyboard / handwriting / dictation</b> composer.<br>Type something — the app shows what it receives.</div>

  <label for="f1">FIELD 1 — SINGLE LINE</label>
  <input id="f1" type="text" placeholder="Tap here, then type…" autocomplete="off">

  <label for="f2">FIELD 2 — NOTES</label>
  <textarea id="f2" placeholder="Or write a longer note…"></textarea>

  <div class="receivedBox">
    <div class="cap">THE APP RECEIVED:</div>
    <div id="received">— nothing yet —</div>
    <div id="meta">0 characters</div>
  </div>

  <div id="log">Waiting… select a field to start.</div>

  <button id="clearBtn" type="button">CLEAR EVERYTHING</button>
</div>
<script>
  var received = document.getElementById('received');
  var meta = document.getElementById('meta');
  var logEl = document.getElementById('log');
  var lines = [];
  function log(msg){
    lines.unshift(msg);
    if(lines.length > 3) lines.pop();
    logEl.textContent = lines.join('\n');
  }
  function show(val, from){
    received.textContent = val ? '“' + val + '”' : '— nothing yet —';
    meta.textContent = (val ? val.length : 0) + ' characters · last from ' + from;
  }
  function wire(id, name){
    var el = document.getElementById(id);
    el.addEventListener('focus', function(){ log('👁 ' + name + ' focused — composer should open'); });
    el.addEventListener('input', function(){ show(el.value, name + ' (live)'); });
    el.addEventListener('change', function(){ show(el.value, name + ' (committed)'); log('✔ ' + name + ' committed: “' + el.value + '”'); });
  }
  wire('f1', 'Field 1');
  wire('f2', 'Field 2');
  document.getElementById('clearBtn').addEventListener('click', function(){
    document.getElementById('f1').value = '';
    document.getElementById('f2').value = '';
    show('', 'cleared');
    log('🧹 Cleared');
  });
</script>
</body>
</html>
